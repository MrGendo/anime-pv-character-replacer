# 示例配置 — 各键含义与默认值说明(复制为 pipeline.yaml 后按需修改)
#
# 合并规则:本文件与 config.py 内置 DEFAULT_CONFIG 做深合并,
# 这里的值覆盖默认值;值写 null 的键视为「未设置」,沿用默认值。

# 配置结构版本(与管线能力版本对应,当前 0.1 = W1)
version: "0.1"

source:
  # 源视频路径(相对项目根或绝对路径)
  video_path: assets/raw_pv/your_video.mp4
  # 素材原始出处(URL),留空表示本地文件
  video_url: ""
  # 版权/使用范围备注:替换产物的使用边界要在这里写清楚
  license_note: "仅本地研究用"

# 切片段定义:name 会成为输出文件名(assets/segments/{name}.mp4)
# start/end 单位秒;note 记录选段理由。
# 建议先用 --stage shots 跑镜头边界检测,再按镜头边界回填 start/end。
segments:
  - name: A
    start: 15
    end: 20
    note: "示例:占位时间,时间以镜头扫描结果为准"
  - name: B
    start: 60
    end: 65
    note: "示例:占位时间,时间以镜头扫描结果为准"

paths:
  # 素材根:segments/(切片产物)与 character_sheets/(人设图)都在其下
  assets_root: assets
  # 每次 run 的产物根:output/{run_id}/{stage}/
  output_root: output
  # 中间工作目录(帧缓存、临时权重等)
  workdir_root: output/work

# 人物检测(W2 波次生效)
detection:
  # 检测后端:固定 yolon(面向动画人物的 YOLO 变体)
  method: yolon
  # 检出置信度阈值,低于此分的目标丢弃。
  # 注意:yolov8n 是 COCO 照片域模型,动画画面置信度整体偏低,
  # 远景/线稿风格片段建议 0.15 左右,近景真人感画面 0.35 即可
  score_thresh: 0.15
  # 推理设备:本机无 GPU,固定 cpu
  device: cpu
  # 单帧最多保留的人物数,超出按置信度取 top-K
  max_persons: 4
  # 检测帧步长:每 N 帧真实推理一次,跳过帧按相邻两次检测线性插值。
  # CPU 预算 ~150ms/帧;超预算时调大(如 2),代价是中间帧 bbox 为近似值
  frame_stride: 1
  # VLM 人物检测(vlm_grounding)的 keyframe 间隔:每 N 帧真实请求一次 VLM
  # (SiliconFlow Qwen3-VL,需设 SILICONFLOW_API_KEY),中间帧线性插值 bbox。
  # 调小更准更贵,调大更省更糊;yolon 对动画远景检出率低时用它补/替
  grounding_interval: 5

# 人物替换(W3 波次生效)
replacement:
  # 替换方法三路径:
  #   sprite  = 人设图白底抠像,按 bbox 缩放贴入(本地 CPU,零成本)
  #   palette = bbox 区域向人设色板做 LAB 颜色迁移(本地 CPU,零成本)
  #   api_doc = 付费风格化 API(未授权未运行:未设 key 时 compose 退出码 2,
  #             设了也只打印将要调用的 endpoint/参数,不真实调用)
  method: sprite
  # 默认人设图(1440x720 三视图,白底;compose --chara-sheet 可按片段覆盖)
  chara_sheet: assets/character_sheets/chara_aoi_sheet.png
  # api_doc 路径参数(仅该路径使用)
  api:
    # 风格化服务 endpoint(本机服务直连,Python 内不走系统代理)
    endpoint: "http://localhost:8000/v1/stylize"
    # API key 的环境变量名 —— key 只从环境变量读,配置文件里严禁出现明文 key
    key_env: ARK_API_KEY
    # 模型名,留空用服务端默认
    model: ""
    # 失败重试次数
    retries: 3
    # 单次请求超时(秒)
    timeout_s: 30
  # sprite 路径参数:边缘羽化的核宽(像素)与高斯 sigma
  edge_blend_px: 12
  feather_sigma: 8

# 目标跟踪(W2 波次生效)
tracking:
  # 轨迹平滑窗口(帧):bbox 滑动均值滤波的窗口长度
  smoothing_window: 7
  # 检测丢目标后允许的最大空缺帧数,超过则断轨(重现也不再续原 ID)
  max_gap_frames: 8
  # 帧间 IoU 匹配阈值:上一帧轨迹与当前检测的 IoU 低于此值视为不同目标
  iou_threshold: 0.3

# 导出编码(重编码路径的参数)
export:
  fps: 23.976
  crf: 18
  preset: slow

# 替换质量评估(W4 波次生效)
evaluation:
  metrics: [ssim, lpips, clip_i, temporal_stability]
  # 各指标加权合成总分,权重和应为 1
  weights:
    ssim: 0.3
    lpips: 0.3
    clip_i: 0.2
    temporal_stability: 0.2
