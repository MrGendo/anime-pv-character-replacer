# 主配置 — anime_pv_replacer 管线(W1)
# 未写的键自动回退到 config.py 内置默认值;注释齐全的模板见 pipeline.example.yaml

version: "0.1"

source:
  video_path: assets/raw_pv/magical_explorer_pv1_1080p.mp4
  video_url: ""
  license_note: "マジカル★エクスプローラー 第1弾PV(仅本地研究用)"

# 切片段定义(单位:秒)。当前为占位时间,时间以镜头扫描结果为准。
segments:
  - name: A
    start: 15
    end: 20
    note: "时间以镜头扫描结果为准"
  - name: B
    start: 60
    end: 65
    note: "时间以镜头扫描结果为准"

paths:
  assets_root: assets
  output_root: output
  workdir_root: output/work

# 人物检测(W2 生效)
detection:
  method: yolon
  score_thresh: 0.35
  device: cpu
  max_persons: 4

# 人物替换(W3 生效)。key 一律从环境变量读(key_env),严禁写明文。
replacement:
  method: stylization
  api:
    endpoint: "http://localhost:8000/v1/stylize"
    key_env: ARK_API_KEY
    model: ""
    retries: 3
    timeout_s: 30
  edge_blend_px: 12
  feather_sigma: 8

# 目标跟踪平滑(W2 生效)
tracking:
  smoothing_window: 7
  max_gap_frames: 8

# 导出编码
export:
  fps: 23.976
  crf: 18
  preset: slow

# 替换质量评估(W4 生效)
evaluation:
  metrics: [ssim, lpips, clip_i, temporal_stability]
  weights:
    ssim: 0.3
    lpips: 0.3
    clip_i: 0.2
    temporal_stability: 0.2
