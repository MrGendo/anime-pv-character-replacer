# 主配置 — anime_pv_replacer 管线(W1)
# 未写的键自动回退到 config.py 内置默认值;注释齐全的模板见 pipeline.example.yaml

version: "0.1"

source:
  video_path: assets/raw_pv/magical_explorer_pv1_1080p.mp4
  video_url: ""
  license_note: "マジカル★エクスプローラー 第1弾PV(仅本地研究用)"

# 切片段定义(单位:秒)。基于 VLM 帧扫描 + 镜头边界检测锁定(见 docs/MATERIALS.md)。
segments:
  - name: A
    start: 59.309
    end: 64.606
    note: "two-person magic-circle scene: cloaked boy + blonde girl (wide shot + close-up), aligned to shot boundary"
  - name: B
    start: 75.325
    end: 84.710
    note: "single-person action sequence: black-jacket boy mid-air fight, 6 fast cuts, aligned to shot boundary"

paths:
  assets_root: assets
  output_root: output
  workdir_root: output/work

# 人物检测(W2 生效)
detection:
  method: yolon
  # 实测校准(2026-10-12):yolov8n 为 COCO 照片域模型,对动画画面置信度整体偏低 —
  # A 段(远景双人)person 分数峰值 0.234,B 段(近景动作)峰值 0.926;
  # 0.35 会把 A 段全部滤空,取 0.15 兼顾两段(误检由 NMS + max_persons + 跟踪平滑兜底)
  score_thresh: 0.15
  device: cpu
  max_persons: 4
  # 检测帧步长:每 N 帧做一次真实推理,跳过帧按相邻两次检测线性插值。
  # 预算 ~150ms/帧;yolon 实测 CPU 约 20ms/帧,保持默认 1(逐帧真实检测)即可
  frame_stride: 1

# 人物替换(W3 生效)。key 一律从环境变量读(key_env),严禁写明文。
replacement:
  method: stylization
  api:
    endpoint: "http://localhost:8000/v1/stylize"
    key_env: ARK_API_KEY
    model: ""
    retries: 3
    timeout_s: 30
  edge_blend_px: 12
  feather_sigma: 8

# 目标跟踪平滑(W2 生效)
tracking:
  smoothing_window: 7
  max_gap_frames: 8
  # 帧间 IoU 匹配阈值:上一帧轨迹与当前检测的 IoU 低于此值视为不同目标
  iou_threshold: 0.3

# 导出编码
export:
  fps: 23.976
  crf: 18
  preset: slow

# 替换质量评估(W4 生效)
evaluation:
  metrics: [ssim, lpips, clip_i, temporal_stability]
  weights:
    ssim: 0.3
    lpips: 0.3
    clip_i: 0.2
    temporal_stability: 0.2
